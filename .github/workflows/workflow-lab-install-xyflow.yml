name: Install MIT React Flow for Workflow Lab
on:
  push:
    branches:
      - feat/workflow-lab-graph-runtime-20261104
    paths:
      - .github/workflows/workflow-lab-install-xyflow.yml
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'AlexiVion/automation-control-room'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-lab-graph-runtime-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock MIT-licensed React Flow dependency
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund @xyflow/react@12.12.1
          node -e "const p=require('./package.json');if(p.dependencies['@xyflow/react']!=='12.12.1')process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'XYFLOW_ALREADY_LOCKED'
            exit 0
          fi
          git commit -m "build(lab): pin MIT-licensed React Flow with npm lockfile"
          git push origin HEAD:feat/workflow-lab-graph-runtime-20261104
          echo 'XYFLOW_LOCKED'

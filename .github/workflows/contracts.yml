name: contracts
on:
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'docs/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck strict contracts
        run: npm run typecheck
      - name: Run structural, graph and OpenAPI contract tests
        run: npm run test:contracts
      - name: Check committed structural JSON Schema snapshot
        run: npm run contracts:check
